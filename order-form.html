<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御梅園 優質果乾 - 同事訂購單（空白）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f7f5f0;
    color: #333;
    margin: 0;
    padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    background: #8a4a2f;
    color: white;
    padding: 20px 24px;
    border-radius: 12px 12px 0 0;
  }
  header h1 { margin: 0 0 4px; font-size: 39px; }
  header p { margin: 0; font-size: 23px; opacity: 0.9; }
  .info-box {
    background: white;
    padding: 16px 24px;
    border: 1px solid #e0dcd0;
    border-top: none;
  }
  .info-box label { display: block; font-size: 24px; color: #666; margin-bottom: 6px; }
  .info-box input {
    width: 100%; padding: 14px 16px; border: 1px solid #ccc; border-radius: 8px;
    font-size: 26px; margin-bottom: 10px;
  }
  .categories {
    background: white;
    border: 1px solid #e0dcd0;
    border-top: none;
    padding: 8px 24px 20px;
  }
  .category { margin-top: 18px; }
  .category h2 {
    font-size: 29px;
    color: #8a4a2f;
    border-bottom: 2px solid #8a4a2f;
    padding-bottom: 4px;
    margin-bottom: 8px;
  }
  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 8px 16px;
  }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed #eee;
    font-size: 26px;
  }
  .item-row .name { flex: 1; }
  .item-row .price { color: #999; font-size: 23px; margin-right: 10px; white-space: nowrap; }
  .item-row input[type="number"] {
    width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 8px;
    text-align: center; font-size: 24px;
  }
  .submit-bar {
    background: white; border: 1px solid #e0dcd0; border-top: none;
    padding: 16px 24px; border-radius: 0 0 12px 12px;
  }
  .submit-bar button {
    background: #8a4a2f; color: white; border: none; padding: 16px 36px;
    border-radius: 10px; font-size: 27px; cursor: pointer;
  }
  .submit-bar button:hover { background: #723c25; }
  .submit-bar button:disabled { background: #ccc; cursor: not-allowed; }
  .msg { font-size: 23px; margin-top: 8px; }
  .msg.error { color: #c0392b; }
  .msg.ok { color: #1a7a3d; }

  .list-section {
    margin-top: 24px;
    background: white;
    border: 1px solid #e0dcd0;
    border-radius: 12px;
    padding: 16px 24px 20px;
  }
  .list-section h2 { font-size: 32px; color: #8a4a2f; margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 24px; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 500; }
  .order-name { font-weight: bold; color: #8a4a2f; }
  .total-row td { font-weight: bold; border-top: 2px solid #8a4a2f; }
  .empty-note { color: #999; font-size: 23px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>御梅園 優質果乾</h1>
    <p>同事訂購單 - 每包110元(部分除外)，滿2200元享免運宅配</p>
  </header>

  <div class="list-section intro" style="margin-top:0; border-radius:0; border-top:none; background:#fff8ec;">
    <h2 style="font-size:30px;">🎬 御梅園 PART 2，在大家的敲碗聲中回歸！</h2>
    <p style="font-size:24px; line-height:1.7; margin:0;">
      同事一直敲碗，郁嘉自己也嘴饞，年底又剛好要過節——<br>
      三個理由湊在一起，就算上帝想攔也攔不住。<br>
      上一集有人吃到停不下來，這一集預計有人<b>邊填單邊流口水</b>。<br>
      要吃就趁現在，過節送禮、辦公室零食、半夜偷吃，一次備齊。🍬<br>
      <span style="color:#8a4a2f;">（郁嘉保證：點進來只有梅子，沒有加班。）</span>
    </p>
  </div>

  <div class="info-box">
    <label>訂購人姓名</label>
    <input type="text" id="orderer-name" placeholder="請輸入姓名">
  </div>

  <div class="list-section" style="margin-top:0; border-radius:0; border-top:none;">
    <h2>🤔 上次訂了什麼？腦袋一片空白？</h2>
    <p class="empty-note" style="margin:0 0 10px;">別緊張，連果乾都記得你，只是你自己忘了。在上面填好姓名，按下面的按鈕，上次買的、買幾包通通幫你翻出來（不滿意還能取消）。</p>
    <button onclick="queryMyOrders()" style="background:#8a4a2f; color:white; border:none; padding:14px 30px; width:100%; border-radius:10px; font-size:24px; cursor:pointer; white-space:nowrap;">查詢我的歷史訂單</button>
    <div id="query-result" style="margin-top:12px;"></div>
  </div>

  <div class="categories" id="categories"></div>

  <div class="submit-bar">
    <button id="submit-btn" onclick="submitOrder()">送出訂購</button>
    <div id="msg" class="msg"></div>
  </div>

</div>

<script>
// ↓↓↓ 把你的 Google Apps Script 網頁應用程式網址貼在這裡 ↓↓↓
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxFNkVN9a6GBpMbYtep8I6jlgxe3oaRG-Jp0EVDhBZf32NOE8AE3h0KT6ulkvdU-zzt/exec";
// ↑↑↑ 記得結尾要是 /exec ↑↑↑

const DATA = {
  "梅子系列": { price: 110, items: ["甘甜梅","無籽梅","日式梅片","日式梅肉","益生菌梅肉","冰梅","櫻桃梅","化核梅","烏龍茶梅","紫蘇梅","脆梅","消脂梅","甘草梅","烏梅","咖啡梅","梅粉"] },
  "橄欖系列": { price: 110, items: ["化核橄欖","甘草橄欖簽","原味橄欖","無籽甘草橄欖","辣橄欖","橄欖片"] },
  "治咳系列": { price: null, items: [
    {name: "柚仔茶", price: 110},
    {name: "薄荷金桔", price: 110},
    {name: "蜂蜜金棗", price: 110},
    {name: "枇杷喉糖", price: 110},
    {name: "醋酸檸檬", price: 110},
    {name: "陳皮梅", price: 110},
    {name: "黃金桔", price: 110},
    {name: "金桔餅", price: 110},
    {name: "陳皮", price: 110}
  ]},
  "水果系列": { price: 110, items: ["芭樂乾","愛文芒果乾","黃金水蜜桃","金綻百香梅片","草莓果粒梅片","胭脂芭樂梅片","金旺萊梅片","台灣百香果乾","雲林鮮橙果片","黃金檸檬","全果粒蔓越莓","芒果乾","鳳梨乾","番茄乾","鹹葡萄乾","無籽脆桃","香橙水蜜桃"] },
  "綜合系列": { price: 110, items: ["相思果","洛神花","小紅莓","蒟蒻乾","辣芒果乾","無花果(木瓜絲)","辣豆干","沙茶豆干","香川豆干條","黑糖Q棗","化應子","大仙李","情人果","仙楂片","小丸子","梅花餅","山楂油切果"] }
};

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function fmtDate(v){
  const n = Number(v);
  const d = (isFinite(n) && n > 1e11) ? new Date(n) : new Date(v);
  if (isNaN(d.getTime())) return v;
  const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function buildForm() {
  const container = document.getElementById('categories');
  Object.keys(DATA).forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const h2 = document.createElement('h2');
    h2.textContent = cat;
    catDiv.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'item-grid';

    DATA[cat].items.forEach(entry => {
      const name = typeof entry === 'string' ? entry : entry.name;
      const price = typeof entry === 'string' ? DATA[cat].price : entry.price;
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <span class="name">${name}</span>
        <span class="price">$${price}</span>
        <input type="number" min="0" value="0" data-item="${name}" data-price="${price}" data-cat="${cat}">
      `;
      grid.appendChild(row);
    });
    catDiv.appendChild(grid);
    container.appendChild(catDiv);
  });
}
buildForm();

async function submitOrder() {
  const msgEl = document.getElementById('msg');
  const name = document.getElementById('orderer-name').value.trim();
  if (!name) {
    msgEl.className = 'msg error';
    msgEl.textContent = '請輸入訂購人姓名';
    return;
  }
  const inputs = document.querySelectorAll('#categories input[type="number"]');
  const items = [];
  inputs.forEach(inp => {
    const qty = parseInt(inp.value, 10) || 0;
    if (qty > 0) {
      items.push({ item: inp.dataset.item, price: parseInt(inp.dataset.price, 10), qty });
    }
  });
  if (items.length === 0) {
    msgEl.className = 'msg error';
    msgEl.textContent = '請至少選擇一項商品的數量';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    const res = await fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name, items })
    });
    const result = await res.json();
    if (!result || !result.success) throw new Error('儲存失敗');
    msgEl.className = 'msg ok';
    msgEl.textContent = '訂購成功！已加入清單。';
    inputs.forEach(inp => inp.value = 0);
    document.getElementById('orderer-name').value = '';
  } catch (e) {
    msgEl.className = 'msg error';
    msgEl.textContent = '送出失敗，請再試一次。';
  } finally {
    btn.disabled = false;
  }
}

async function queryMyOrders() {
  const name = document.getElementById('orderer-name').value.trim();
  const resultEl = document.getElementById('query-result');
  if (!name) {
    resultEl.innerHTML = '<p class="empty-note">請先在上面填好訂購人姓名</p>';
    return;
  }
  resultEl.innerHTML = '<p class="empty-note">查詢中...</p>';
  try {
    const res = await fetch(WEBAPP_URL + '?action=query&name=' + encodeURIComponent(name));
    const orders = await res.json();
    if (!orders || orders.length === 0) {
      resultEl.innerHTML = '<p class="empty-note">查無此姓名的訂單。</p>';
      return;
    }
    let html = '';
    orders.forEach(o => {
      let total = 0;
      const itemsText = o.items.map(it => {
        total += it.qty * it.price;
        return `${esc(it.item)} x${it.qty}`;
      }).join('、');
      const safeName = o.name.replace(/'/g, "\\'");
      html += `<div style="border:1px solid #e0dcd0; border-radius:8px; padding:10px 14px; margin-top:10px;">
        ${(o.date||o.time||o.timestamp) ? `<div style="color:#888; font-size:21px; margin-bottom:4px;">${esc(fmtDate(o.date||o.time||o.timestamp))}</div>` : ''}${o.paid ? `<div style="color:#c0392b; font-weight:bold; font-size:21px;">${o.paidDate ? esc(o.paidDate)+' ' : ''}已付款</div>` : ''}
        <div style="font-size:24px;">${itemsText}</div>
        <div style="color:#888; font-size:21px; margin-top:4px;">小計 $${total}</div>
        <button onclick="cancelMyOrder('${o.orderId}', '${safeName}')" style="margin-top:8px; background:#c0392b; color:white; border:none; padding:12px 24px; border-radius:8px; font-size:21px; cursor:pointer;">取消此筆訂單</button>
      </div>`;
    });
    resultEl.innerHTML = html;
  } catch (e) {
    resultEl.innerHTML = '<p class="empty-note">查詢失敗，請再試一次。</p>';
  }
}

async function cancelMyOrder(orderId, name) {
  if (!confirm('確定要取消這筆訂單嗎？此動作無法復原。')) return;
  try {
    const res = await fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'cancel', orderId, name })
    });
    const result = await res.json();
    if (result && result.success) {
      alert('已取消這筆訂單。');
      queryMyOrders();
    } else {
      alert('取消失敗，請再試一次。');
    }
  } catch (e) {
    alert('取消失敗，請再試一次。');
  }
}
</script>
</body>
</html>
